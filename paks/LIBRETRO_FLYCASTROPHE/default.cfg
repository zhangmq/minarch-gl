# GLES hw-render: the sound device paces the frame loop (Frontend > Frame Pacing).
minarch_frame_pacing = Audio

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind X Button = X
bind Y Button = Y
bind B Button = B
bind A Button = A
bind L1 Button = L1
bind L2 Button = L2
bind R1 Button = R1
bind R2 Button = R2

# Dreamcast boots through the core's own loader (HLE BIOS) instead of a real
# dc_boot.bin.  Without it a Dreamcast disc whose CDI boot sector is defective
# (many are; flycast warns about CDI images) stops on the BIOS menu and never
# starts the game, and flycast v2.0 only worked because it booted the disc
# directly.  Naomi does not read this: it has no BIOS boot.
reicast_hle_bios = enabled
